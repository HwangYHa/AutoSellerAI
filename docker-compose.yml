services:
  autoseller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  seller-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-api
    command: ["uvicorn", "app.os.api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  seller-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-worker
    command: ["rq", "worker", "sync", "automation", "dangerous", "--url", "redis://redis:6379/0"]
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  social-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-social-api
    command: ["uvicorn", "app.social.threads.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  threads-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-threads-worker
    command: ["rq", "worker", "threads", "--url", "redis://redis:6379/0"]
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  threads-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-threads-scheduler
    command: ["python", "-m", "app.social.threads.scheduling"]
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autoseller-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
