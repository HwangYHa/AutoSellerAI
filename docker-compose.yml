services:
  postgres:
    image: postgres:17-alpine
    container_name: autoseller-postgres
    environment:
      POSTGRES_DB: autoseller
      POSTGRES_USER: autoseller
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoseller_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoseller -d autoseller"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-db-bootstrap
    command: ["python", "scripts/migrate_sqlite_to_postgres.py"]
    volumes:
      - ./data:/legacy:ro
      - sqlite-data:/sqlite:ro
    environment:
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      SQLITE_VOLUME_DB: /sqlite/autoseller.db
      LEGACY_DB_PATH: /legacy/autoseller.db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  autoseller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
      SD_WEBUI_URL: ${SD_WEBUI_DOCKER_URL:-http://host.docker.internal:7860}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  seller-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-api
    command: ["uvicorn", "app.os.api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  seller-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-worker
    command: ["rq", "worker", "sync", "automation", "--url", "redis://redis:6379/0"]
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  image-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-image-worker
    command: ["rq", "worker", "image", "--url", "redis://redis:6379/0"]
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
      SD_WEBUI_URL: ${SD_WEBUI_DOCKER_URL:-http://host.docker.internal:7860}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  seller-dangerous-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-dangerous-worker
    command: ["rq", "worker", "dangerous", "--url", "redis://redis:6379/0"]
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  seller-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-scheduler
    command: ["python", "-m", "app.os.scheduler"]
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  social-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-social-api
    command: ["uvicorn", "app.social.threads.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  threads-local-proxy:
    image: nginx:1.27-alpine
    container_name: autoseller-threads-local-proxy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./certs/threads-sample.meta.pem:/etc/nginx/certs/threads-sample.meta.pem:ro
      - ./certs/threads-sample.meta-key.pem:/etc/nginx/certs/threads-sample.meta-key.pem:ro
      - ./nginx/threads-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      social-api:
        condition: service_healthy
    restart: unless-stopped

  threads-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-threads-worker
    command: ["rq", "worker", "threads", "--url", "redis://redis:6379/0"]
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  threads-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoseller-threads-scheduler
    command: ["python", "-m", "app.social.threads.scheduling"]
    volumes:
      - ./data:/app/data
      - sqlite-data:/app/sqlite
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/sqlite/autoseller.db
      DATABASE_URL: postgresql+psycopg://autoseller:${POSTGRES_PASSWORD:-autoseller_local}@postgres:5432/autoseller
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autoseller-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  sqlite-data:
  postgres-data:
