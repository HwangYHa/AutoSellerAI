name: AutoSellerAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: /tmp/autoseller_test.db
      CLAUDE_API_KEY: ""
      THREADS_AUTO_REPLY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full pytest suite
        run: pytest -q

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:////tmp/autoseller_migration.db
      DB_PATH: /tmp/autoseller_migration_legacy_fallback.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Upgrade canonical Seller OS schema
        run: alembic upgrade head
      - name: Verify migration head
        run: alembic current | grep 20260814_0002
      - name: Verify canonical tables
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          e = create_engine('sqlite:////tmp/autoseller_migration.db')
          names = set(inspect(e).get_table_names())
          required = {'os_products','os_product_variants','os_supplier_offers','os_offer_verifications','os_listings','os_sales_orders','os_sales_order_items','os_fulfillments','os_settlement_lines','os_approval_requests','os_operation_executions','os_background_tasks'}
          assert required <= names, required - names
          print('migration tables ok:', len(names))
          PY

  profit-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_PATH: /tmp/autoseller_profit_cycle.db
      CLAUDE_API_KEY: ""
      THREADS_AUTO_REPLY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run closed-loop profit feedback test
        run: pytest -q tests/test_threads_profit_cycle.py -vv

  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime environment
        run: |
          cp .env.example .env
          mkdir -p data
      - name: Validate Compose
        run: docker compose config
      - name: Build services
        run: docker compose build
      - name: Start services
        run: docker compose up -d
      - name: Wait for Seller OS, Seller API and Social API
        run: |
          set -e
          for i in {1..40}; do
            if curl -fsS http://localhost:8501/_stcore/health >/dev/null \
              && curl -fsS http://localhost:8001/health >/dev/null \
              && curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Seller OS, Seller API and Social API are healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Services failed to become healthy"
          docker compose ps
          docker compose logs --no-color --tail=400
          exit 1
      - name: Verify Redis
        run: docker compose exec -T redis redis-cli ping | grep PONG
      - name: Verify Seller workers
        run: |
          docker compose ps seller-worker | grep autoseller-worker
          docker compose ps seller-dangerous-worker | grep autoseller-dangerous-worker
      - name: Show service status
        run: docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=500
      - name: Shutdown
        if: always()
        run: docker compose down -v
